# Publishes the package to npm, only from a reviewed release tag.
#
# Hardening notes (see PR body for finding IDs):
# - FL-01: the unreviewed `workflow_dispatch` publish route was removed; publishing
#   now requires a published GitHub Release (which checks out the tag ref), plus a
#   protected `npm-publish` environment and a tag/version match assertion.
# - FL-02: the publish job installs nothing, so no dependency lifecycle script can
#   run while the npm token is in the environment.
# - FL-03: OIDC `id-token: write` + `npm publish --provenance`.
# - FL-04: every action is pinned to a full 40-character commit SHA.
# - FL-05: dependencies are installed from the committed pnpm lockfile with
#   `--frozen-lockfile`.
# - FL-08: a dependency audit gate runs before anything can publish.

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Enable pnpm from the declared packageManager
        run: corepack enable
      - name: Install from the frozen lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Verify the release tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
